name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.23.4
      uses: actions/setup-node@v4
      with:
        node-version: "22.23.4"
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run check

    - name: Landing SEO index check
      run: npm run landing:seo-index:check

    - name: Run Tests
      run: npm test

    - name: Build
      run: npm run build
